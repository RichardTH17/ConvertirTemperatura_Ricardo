<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conversor de Temperatura</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body class="bg-success-subtle">
    <main class="container py-5">
        <div class="card shadow-sm p-4" style="max-width: 450px">
            <h1 class="h3 mb-4">Conversor de Temperatura</h1>

            <div class="mb-3">
                <label for="gradosC" class="form-label fw-bold">Grados Celsius (°C)</label
          >
          <div class="input-group">
            <input
              value="40"
              id="gradosC"
              class="form-control"
              type="number"
              step="any"
              placeholder="Ej. 25"
            />
            <button
              type="button"
              id="btnConvertir"
              class="btn btn-primary fw-bold"
            >
              Convertir
            </button>
          </div>
        </div>

        <hr />

        <div class="mb-3">
          <label for="gradosKI" class="form-label fw-bold"
            >Grados Kelvin (K)</label
          >
          <input
            type="text"
            id="gradosKI"
            class="form-control bg-light"
            readonly
          />
        </div>

        <div class="mb-0">
          <label for="gradosFI" class="form-label fw-bold"
            >Grados Fahrenheit (°F)</label
          >
          <input
            type="text"
            id="gradosFI"
            class="form-control bg-light"
            readonly
          />
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
